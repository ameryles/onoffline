[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ameryles-onoffline"
version = "0.1.0"
description = "对齐线上样本与评测样本，比较各指标差异并标出背离项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ameryles" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ameryles.github.io"
Repository = "https://github.com/ameryles/onoffline"
Issues = "https://github.com/ameryles/onoffline/issues"

[project.scripts]
onoffline = "onoffline:main"

[tool.setuptools]
py-modules = ["onoffline"]
